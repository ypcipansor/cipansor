# Scheduled mutation testing on the curated critical-path set (auth, admissions).
#
# Why this exists and why it is not on every pull request: coverage answers "was
# this line run?"; mutation testing answers "would a test have noticed if it
# behaved differently?". A full run is far too slow for the merge gate, so it
# runs weekly against a small, hand-picked set of files where an untested branch
# has real consequences — and it is a *signal*, not a gate: a regression opens an
# issue and fails the job, it does not block a merge.
#
# The assertion-quality complement to the coverage floor in ci.yml. See
# docs/COVERAGE.md and apps/api/stryker.config.mjs.
name: Mutation tests

on:
  schedule:
    # Mondays 05:00 Asia/Jakarta (= Sunday 22:00 UTC).
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  mutate:
    name: Mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cipansor_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-key-for-ci
      RUN_DB_TESTS: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cipansor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api db:generate
      # The mutated services import @cipansor/shared through the workspace link
      # (node_modules/@cipansor/shared -> packages/shared), i.e. its built dist.
      - run: pnpm --filter @cipansor/shared build
      - name: Push database schema
        run: pnpm --filter api db:push
      - name: Run mutation testing on the critical-path set
        # continue-on-error: a break in the Stryker threshold should still let the
        # gate read the report and open the issue.
        continue-on-error: true
        run: pnpm --filter api mutation
      - name: Evaluate the mutation score
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/mutation-gate.mjs --issue
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: apps/api/reports/mutation/
          retention-days: 30
