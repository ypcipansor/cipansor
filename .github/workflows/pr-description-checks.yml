# Advisory reminders for PR descriptions. Warning-only by design: this workflow
# posts a comment and never fails, labels or changes the draft state, so it
# cannot block a merge or a release.
#
#   template job -> asks for the parts of the PR template that are missing
#   visual job   -> asks for before/after visuals when apps/web changed
#
# Runs on `pull_request_target` so the token can comment even on a fork PR;
# neither job checks out or runs any code from the PR, so that is safe here.
#
# The rules live in .github/scripts/ so they can be run by hand.
name: PR description checks (advisory)

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  template:
    name: PR template reminder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check the description against the template
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: sh .github/scripts/pr-template-guard.sh "$PR"

  visual:
    name: Before/after visual reminder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check for before/after visuals on a UI change
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: sh .github/scripts/visual-evidence.sh "$PR"
