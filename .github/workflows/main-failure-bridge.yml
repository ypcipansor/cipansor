# Dispatch the deployment monitor the moment a workflow on `main` fails.
#
# GitHub Actions is the deterministic bridge: it sees the finished result of
# every workflow on `main` and dispatches only while the run that failed is still
# the tip of `main` — so a failure mid-PR (which never has `main` as its branch)
# never raises an issue, and an older failure whose tip has already moved on is
# left to the event of the newer tip. This mirrors `pr-lifecycle.yml`, which
# dispatches the review gate.
#
# The monitor itself (`Pemantau deployment`) lives in the automation service and
# is dispatched by id, the same way the review gate is.
name: Main failure bridge

on:
  # Only workflows that actually run on `main`: CI and E2E on a push, and the
  # staging deploy that follows a green E2E run. `Deploy production` is manual
  # (workflow_dispatch), so it never produces a `workflow_run` here.
  workflow_run:
    workflows: [CI, E2E Tests, Deploy staging]
    types: [completed]

permissions:
  contents: read
  actions: read
  statuses: read

jobs:
  dispatch:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm the failure is still the tip of main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The tip is read from the Checks API, not the legacy commit-status
          # API: this repo reports check-runs, so the status API is always empty
          # and would never skip. If the tip has moved past the run that
          # failed, a newer merge already superseded it — that tip's own failure
          # dispatches the monitor, not this stale one.
          TIP=$(gh api "repos/$REPO/commits/main/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI and E2E passed")][0].head_sha' \
            2>/dev/null || echo "")
          echo "tip=$TIP failed=$FAILED_SHA"
          if [ -n "$TIP" ] && [ "$TIP" != "$FAILED_SHA" ]; then
            echo "main has moved past the failed run; skipping dispatch"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch the deployment monitor
        if: steps.gate.outputs.skip != '1'
        env:
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          MONITOR_ID="${SDLC_DEPLOY_MONITOR_ID:-e827ff1a-2bcd-479a-b932-29e71abfe99d}"
          if [ -z "$OPENHANDS_API_KEY" ]; then
            echo "OPENHANDS_API_KEY is not set; the monitor cannot be dispatched."
            exit 0
          fi
          code=$(curl -s -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            "https://app.all-hands.dev/api/automation/v1/$MONITOR_ID/dispatch" \
            -H "Authorization: Bearer $OPENHANDS_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"main-failure-bridge\",\"run_id\":\"$RUN_ID\",\"workflow\":\"$WORKFLOW\"}")
          echo "Dispatched the deployment monitor for run $RUN_ID ($WORKFLOW), HTTP $code."
          cat /tmp/dispatch.out
