# Keep the changelog current from the pull requests that actually merged.
#
# The release path is automated everywhere except the changelog: an automation
# that fires on `release.published` (SDLC 14) is dark until a human publishes a
# Release, and this repository has published none. A scheduled run cannot be
# skipped that way — it reads `main`'s merged PRs on a timer and opens one pull
# request with the entries that are new.
#
# The trigger lives in git on purpose, next to the guard that pins the grouping
# rule (apps/api/src/utils/changelog.guard.test.ts), so the rule is reviewable
# and testable in CI rather than only in an automation definition outside the
# repository.
#
# 0 15 * * * is 22:00 Asia/Jakarta (WIB, UTC+7).
name: Changelog

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

# One run at a time: two overlapping runs would both read the same base and the
# second would open a duplicate PR.
concurrency:
  group: changelog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changelog:
    name: Generate changelog entries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Needs to push a branch and open a PR, and nothing else.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Full history and tags: the generator reads the newest `v*` tag with
      # `git tag --sort=-creatordate` to know where the PR window starts.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # The grouping rule is a pure function, so it is checked without the
      # network and without an install — this is the only test the change needs.
      - name: Self-test the grouping rule
        run: node scripts/changelog.mjs --self-test

      - name: Generate entries for what merged since the last tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/changelog.mjs --repo "${{ github.repository }}"

      - name: Open or update the changelog pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "changelog: CHANGELOG.md is unchanged — nothing to propose"
            exit 0
          fi

          BRANCH="changelog/auto"
          DATE="$(date -u +%Y-%m-%d)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add CHANGELOG.md
          git commit -m "docs(changelog): entries for $DATE"

          # The checkout keeps no credentials (persist-credentials: false), so
          # the push URL is authenticated here, for this step only. The branch
          # is owned by this workflow and the concurrency group serialises runs,
          # so replacing it is safe.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$BRANCH"

          # `gh pr create` fails when a PR for the branch already exists; the
          # run above it is idempotent, so an existing PR already carries the
          # new commit and there is nothing left to do.
          if gh pr view "$BRANCH" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "changelog: updated the existing pull request on $BRANCH"
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head "$BRANCH" \
              --title "docs(changelog): entries for $DATE" \
              --body "Automated changelog entries for the pull requests merged to \`main\` since the newest \`v*\` tag.

          Generated by the **Changelog** workflow (\`.github/workflows/changelog.yml\`, \`scripts/changelog.mjs\`). Review the grouping and merge when it reads well; the next run adds only what is new.

          _This pull request was created by an AI agent (OpenHands) on behalf of the maintainers._"
          fi
