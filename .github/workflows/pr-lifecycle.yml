# Post the CI result and dispatch the review gate.
#
# Triggered by workflow_run so it sees the finished result of every workflow on
# the PR's head. It never changes the draft/ready state and never approves or
# merges.
#
#   green CI + draft PR              -> post the all-green comment, leave the
#                                       draft decision to a human
#   green CI + ready PR              -> dispatch the review gate (SDLC 22)
#   red CI                           -> quiet (checks are visible on the PR)
#   changes requested on a ready PR  -> quiet (the gate posted the review)
#
# `pull_request_review` is also subscribed so a changes-requested review
# submitted after CI finished is seen, but the rules above are now a no-op for
# that case; it is kept so the script's own state view stays consistent.
#
# The rules live in .github/scripts/pr-lifecycle.sh so they can be run by hand.
name: PR lifecycle

on:
  workflow_run:
    workflows: [CI, E2E Tests]
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: pr-lifecycle-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  lifecycle:
    # Only for PR runs. A push to main has no pull request to act on.
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != null) ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.number != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Apply lifecycle rules
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: sh .github/scripts/pr-lifecycle.sh "$PR" "$HEAD_SHA"
