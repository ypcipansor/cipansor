# Move a PR back to draft while CI is red or a reviewer requested changes.
#
# Triggered by workflow_run so it sees the finished result of every workflow on
# the PR's head — it cannot be the PR's own check, because a check that reverts
# the PR would cancel itself.
#
#   red CI + ready PR                -> convert to draft, comment which checks failed
#   changes requested on a ready PR  -> convert to draft, comment that it needs work
#   green CI + draft PR              -> post the all-green comment, leave the
#                                       draft decision to a human
#   green CI + ready PR              -> leave it alone
#
# It never approves and never merges: approval is the review gate's job
# (SDLC 22), which reads the diff. `pull_request_review` is also subscribed so a
# changes-requested review submitted after CI finished is not missed — a
# review triggers no `workflow_run`, which previously left the PR ready.
#
# The rules live in .github/scripts/pr-lifecycle.sh so they can be run by hand.
name: PR lifecycle

on:
  workflow_run:
    workflows: [CI, E2E Tests]
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: pr-lifecycle-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  lifecycle:
    # Only for PR runs. A push to main has no pull request to act on.
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != null) ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.number != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Apply lifecycle rules
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
        run: sh .github/scripts/pr-lifecycle.sh "$PR" "$HEAD_SHA"
