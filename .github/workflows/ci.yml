# CI Workflow for Cipansor
# Lint, build, test, and security-scan on pull requests and pushes to main.
# There is no deploy stage here (the docker-build job only proves the images
# build), so this is CI, not CD.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into more where needed.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  # Lint (build the shared package first so its types resolve).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api db:generate
      - run: pnpm --filter @cipansor/shared build
      - name: Lint API
        run: pnpm --filter api lint
      - name: Lint Web
        run: pnpm --filter web lint

      # The main web tsconfig excludes e2e/**, so the Playwright specs were
      # never typechecked anywhere: an identifier that was used but never
      # declared only failed at runtime, minutes into the E2E job. This catches
      # it here in seconds instead.
      - name: Typecheck E2E specs
        run: pnpm --filter web typecheck:e2e

  # Build all packages (this also type-checks: api via tsc, web via next build).
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api db:generate
      - run: pnpm --filter @cipansor/shared build
      - name: Build API
        run: pnpm --filter api build
        env:
          # tsc on the full API surface exceeds Node's ~2GB default heap and
          # OOMs (exit 134); raise the limit (runners have plenty of RAM).
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Strict type-check API (incl. tests)
        # `build` uses the lenient tsconfig.build.json (excludes test files);
        # this runs plain `tsc` over the whole source + test tree so strict
        # type errors — the 104 just cleared — can never silently regress.
        run: pnpm --filter api build:strict
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build Web
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NODE_OPTIONS: --max-old-space-size=4096

  # Unit/integration tests, including the DB-backed suite (RUN_DB_TESTS=1).
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cipansor_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-key-for-ci
      RUN_DB_TESTS: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cipansor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api db:generate
      - name: Push database schema
        run: pnpm --filter api db:push
      - name: Run API tests
        run: pnpm --filter api test
      # The web unit suite (~100 vitest specs, incl. the dead-link and RBAC
      # guards) ran in no workflow at all, so a web regression could only be
      # caught by a human running it locally. It needs the shared package's
      # built types but not the database.
      - run: pnpm --filter @cipansor/shared build
      - name: Run Web tests
        run: pnpm --filter web test

  # Supply-chain / dependency security.
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Fail the build on known high/critical advisories in the dependency tree.
      # (actions/dependency-review-action + CodeQL would add PR-diff scanning and
      # SAST, but both require GitHub Advanced Security, which isn't enabled on
      # this repo — this audit + Dependabot are the working equivalents here.)
      # NOTE: `pnpm audit` (through 11.x) still calls npm's retired audit
      # endpoint and dies with HTTP 410, so we query the bulk advisory
      # endpoint directly — see scripts/audit-deps.mjs.
      - name: Audit dependencies
        run: pnpm run audit:deps

  # Docker build sanity check (main only).
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build API Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: cipansor-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: cipansor-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
          cache-from: type=gha
          cache-to: type=gha,mode=max
