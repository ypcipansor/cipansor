name: Feature or change request
description: Propose a new capability, or a change to an existing one.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The `SDLC 19 · Issue labeller` automation sets the correct type
        (`enhancement`, `documentation`, `refactor`, `chore`, `security`) and a
        priority, and marks this `ready` once the fields below are filled well
        enough to implement without further questions. See [docs/LABELS.md](https://github.com/ypcipansor/cipansor/blob/main/docs/LABELS.md).

  - type: dropdown
    id: type
    attributes:
      label: Type of request
      description: The closest type. The labeller corrects it if needed.
      options:
        - enhancement — a new capability
        - documentation — docs only
        - refactor — same behaviour, cleaner code
        - chore — tooling, deps, maintenance
        - security — hardening
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What is hard to do today, or what is wrong with the current behaviour?
      placeholder: Today it is hard to …
    validations:
      required: true

  - type: textarea
    id: desired
    attributes:
      label: Desired behaviour and acceptance criteria
      description: |
        **Desired behaviour** — describe it as if it already worked, concretely
        enough that a reviewer knows when it is done.

        **Acceptance criteria** — the observable outcomes, as checkboxes. These
        are what turns this issue `ready`.
      value: |
        ### Desired behaviour

        ### Acceptance criteria
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why they fall short.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, prior art, or anything else that helps.
    validations:
      required: false
