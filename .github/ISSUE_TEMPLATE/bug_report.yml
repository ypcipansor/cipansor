name: Bug report
description: Something is broken or behaves differently from what was intended.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A bug is a change to fix; a question belongs in Discussions. The
        `SDLC 19 · Issue labeller` automation will add a priority and mark the
        issue `ready` once the fields below are filled well enough to implement
        without further questions. See [docs/LABELS.md](https://github.com/ypcipansor/cipansor/blob/main/docs/LABELS.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: One or two sentences. The observed behaviour, not the guess at its cause.
      placeholder: GET /health answered 200 while the database was down.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The behaviour that should have happened, stated as if it already worked.
      placeholder: GET /health answers 503 when its database probe fails.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce, and acceptance criteria
      description: |
        **Reproduction** — the exact steps, command or request a reviewer can
        follow, with the environment (branch/commit, Node, database state) if it
        matters. A bug without a reproduction is marked `needs-info`, not `ready`.

        **Acceptance criteria** — the observable outcomes that show this is
        fixed, as checkboxes. These are what turns this issue `ready`.

        **Before** — the failing output or screenshot, if you have it.
        **After** — what should replace it.
      value: |
        ### Reproduction
        1.
        2.

        ### Acceptance criteria
        - [ ]
        - [ ]

        ### Before / after
        Before:

        After:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Logs, stack traces, a failing test, a screenshot or a video. Content is
        wrapped in a code block automatically. If you could not reproduce it,
        say so — that is useful, and it keeps this issue out of `ready`.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues, a suspected cause, a workaround, or anything a fixer should know.
    validations:
      required: false
