# nginx for Azure App Service — the main container of the sidecar set.
#
# App Service runs Cipansor as one app with four containers sharing localhost:
#   nginx (this, port 80, the only one App Service sends traffic to)
#   web   (Next.js, 127.0.0.1:3000)
#   api   (Express, 127.0.0.1:3001)
#   redis (127.0.0.1:6379, reached by the api only)
#
# The routing below is the production VM's /etc/nginx/nginx.conf, unchanged in
# substance. What differs, and why:
#   - No TLS here. App Service terminates HTTPS in front of the container and
#     forwards plain HTTP, so there are no certificates, no :443 server, and no
#     :80 -> :443 redirect (App Service "HTTPS only" and Cloudflare do that).
#   - One server block for every host name. Which pages a host serves is decided
#     by the web app itself (apps/web/src/lib/host-split.ts), not by nginx.
#   - X-Forwarded-Proto is passed through from App Service rather than taken
#     from $scheme, which is always "http" inside the container.
#   - Hosts other than the public site and the portal (staging, the
#     *.azurewebsites.net default name) answer with X-Robots-Tag: noindex.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # The visitor's real address.
    #
    # Only Cloudflare can reach this app: App Service access restrictions admit
    # Cloudflare's published ranges and nothing else, and Cloudflare overwrites
    # CF-Connecting-IP on every request it forwards. The TCP peer nginx sees is
    # App Service's own front end, whose internal address is not published, so
    # the header is trusted from any peer — safe only because of that access
    # restriction. Remove the restriction and this line must change with it.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header CF-Connecting-IP;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Index the public site only; the portal already sends noindex itself.
    map $host $robots_tag {
        default               "noindex, nofollow";
        cipansor.or.id        "";
        www.cipansor.or.id    "";
        portal.cipansor.or.id "";
    }

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    upstream web {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream api {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    server {
        listen 80 default_server;
        server_name _;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag              $robots_tag always;

        client_max_body_size 10M;

        location /_next/static/ {
            proxy_pass http://web;
            proxy_cache_bypass $http_upgrade;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Robots-Tag $robots_tag always;
        }

        location /images/ {
            proxy_pass http://web;
            proxy_cache_bypass $http_upgrade;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Robots-Tag $robots_tag always;
        }

        # A regex location beats any plain prefix, so the /uploads/, /socket.io/
        # and /api blocks below use ^~ to keep their images and paths away from it.
        location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
            proxy_pass http://web;
            proxy_cache_bypass $http_upgrade;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Robots-Tag $robots_tag always;
        }

        location ^~ /uploads/ {
            proxy_pass http://api;
            proxy_cache_bypass $http_upgrade;
        }

        location ^~ /socket.io/ {
            proxy_pass http://api;
            proxy_read_timeout 7d;
            proxy_send_timeout 7d;
        }

        location ^~ /api {
            proxy_pass http://api;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        location = /healthz {
            proxy_pass http://api/health;
            access_log off;
        }

        location / {
            proxy_pass http://web;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
